<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caped Underwear Hero Platformer</title>
    <style>
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(90deg, #ffe066 0%, #ffb347 100%);
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(90deg, #ffe066 80%, #7fffd4 100%);
            border-radius: 0;
            box-shadow: none;
        }
        .instructions {
            color: #222;
            text-align: center;
            font-family: sans-serif;
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 0 2px 8px #fff8;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="instructions">
        <p>Use <b>Arrow keys</b> or <b>WASD</b> to move and jump.<br>Press <b>R</b> to restart.</p>
    </div>
    <script>
    // --- Platformer Game ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    let W = () => canvas.width;
    let H = () => canvas.height;

    // Hero properties
    const hero = {
        x: W()/4,
        y: H()/2,
        vx: 0,
        vy: 0,

        w: 60, // Bigger hero
        h: 80,
        speed: 3.2, // Lower speed for less air control
        jump: 15, // Slightly higher jump for bigger hero
        grounded: false,
        color: '#fff6d5', // Brighter skin
        capeColor: '#ff3b3b', // Bright red
        underwearColor: '#fff', // White underwear
        direction: 1,
        anim: 0
    };

    // Platforms
    let platforms = [];
    function randomInt(a, b) {
        return Math.floor(Math.random() * (b - a + 1)) + a;
    }
    let coins = [];
    let enemies = [];
    function resetPlatforms() {
        const baseY = H() * 0.7;
        const step = W() * 0.13;
        const n = randomInt(8, 12);
        platforms = [];
        coins = [];
        enemies = [];
        for (let i = 0; i < n; ++i) {
            let px = W()/4 + step * (i + (Math.random()-0.5)*0.3);
            let py = baseY - i*randomInt(60, 110) + randomInt(-20, 20);
            let pw = randomInt(90, 180);
            let ph = randomInt(16, 26);
            platforms.push({x: px, y: py, w: pw, h: ph, color: '#000'});
            // Add coins above some platforms
            if (Math.random() < 0.7) {
                let cx = px + randomInt(30, pw-30);
                let cy = py - 60;
                coins.push({x: cx, y: cy, r: 12, collected: false});
            }
            // Add enemies on some platforms
            if (i > 0 && Math.random() < 0.4) {
                let ex = px + randomInt(30, pw-30);
                let ey = py - ph/2 - 18;
                let dir = Math.random() < 0.5 ? 1 : -1;
                enemies.push({x: ex, y: ey, w: 36, h: 36, vx: 1.2*dir});
            }
        }
    }
    resetPlatforms();
    window.addEventListener('resize', resetPlatforms);

    // Input
    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === 'r' || e.key === 'R') restart();
    });
    window.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
    });

    function restart() {
        hero.x = W()/4;
        hero.y = H()/2;
        hero.vx = 0;
        hero.vy = 0;
        hero.grounded = false;
        hero.anim = 0;
        resetPlatforms();
    }

    // Physics
    const gravity = 0.7;
    const friction = 0.8;
    const airFriction = 0.98;
    const jumpCooldown = 8;
    let jumpTimer = 0;

    let score = 0;
    function update() {
        // Controls
        let left = keys['arrowleft'] || keys['a'];
        let right = keys['arrowright'] || keys['d'];
        let up = keys['arrowup'] || keys['w'] || keys[' '];

        if (left) {
            if (hero.grounded) {
                hero.vx -= hero.speed * 0.7;
            } else {
                hero.vx -= hero.speed * 0.22; // much less air control
            }
            hero.direction = -1;
        }
        if (right) {
            if (hero.grounded) {
                hero.vx += hero.speed * 0.7;
            } else {
                hero.vx += hero.speed * 0.22;
            }
            hero.direction = 1;
        }
        // Friction
        if (hero.grounded) hero.vx *= friction;
        else hero.vx *= airFriction;

        // Gravity
        hero.vy += gravity;
        // Jump
        if (up && hero.grounded && jumpTimer <= 0) {
            hero.vy = -hero.jump;
            hero.grounded = false;
            jumpTimer = jumpCooldown;
        }
        if (jumpTimer > 0) jumpTimer--;

        // Move
        hero.x += hero.vx;
        hero.y += hero.vy;

        // Platform collision
        hero.grounded = false;
        for (let p of platforms) {
            if (
                hero.x + hero.w/2 > p.x &&
                hero.x - hero.w/2 < p.x + p.w &&
                hero.y + hero.h/2 > p.y &&
                hero.y + hero.h/2 < p.y + p.h &&
                hero.vy > 0
            ) {
                hero.y = p.y - hero.h/2;
                hero.vy = 0;
                hero.grounded = true;
            }
        }
        // No blocks
        // Coin collection
        for (let c of coins) {
            if (!c.collected) {
                let dx = hero.x - c.x;
                let dy = hero.y - c.y;
                if (Math.sqrt(dx*dx + dy*dy) < hero.w/2 + c.r) {
                    c.collected = true;
                    score++;
                }
            }
        }
        // Enemy movement and collision
        for (let e of enemies) {
            if (!e.falling) {
                e.x += e.vx;
                // Bounce off platform edges
                let plat = platforms.find(p => e.x > p.x && e.x < p.x + p.w && Math.abs(e.y + e.h/2 - p.y) < 10);
                if (plat) {
                    if (e.x < plat.x + 10 || e.x > plat.x + plat.w - 10) e.vx *= -1;
                }
            } else {
                e.vy = (e.vy || 0) + 0.7;
                e.y += e.vy;
            }
            // Collide with hero
            if (
                hero.x + hero.w/2 > e.x - e.w/2 &&
                hero.x - hero.w/2 < e.x + e.w/2 &&
                hero.y + hero.h/2 > e.y - e.h/2 &&
                hero.y - hero.h/2 < e.y + e.h/2
            ) {
                // If falling on enemy, defeat it
                if (!e.falling && hero.vy > 0 && hero.y < e.y) {
                    e.falling = true;
                    e.vy = 2;
                    hero.vy = -hero.jump * 0.7;
                    score += 5;
                } else if (!e.falling) {
                    // Otherwise, restart
                    restart();
                    return;
                }
            }
        }

        // Loop if falls below or goes off right
        if (hero.y > H() + 80 || hero.x > W() + 80) restart();

        // Win if reaches far right: generate new map
        if (hero.x > W() - 120) {
            resetPlatforms();
            hero.x = W()/4;
            hero.y = H()/2;
            hero.vx = 0;
            hero.vy = 0;
            hero.grounded = false;
            hero.anim = 0;
            // No blocks to remove
        }
    }

    // No drawBlock needed
    function drawCoin(c) {
        if (c.collected) return;
        ctx.save();
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
        ctx.fillStyle = 'gold';
        ctx.shadowColor = '#ffe066';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.restore();
    }
    function drawEnemy(e) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 16, 0, 0, Math.PI*2);
        ctx.fillStyle = e.falling ? '#888' : '#e55';
        ctx.globalAlpha = e.falling ? 0.7 : 1;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(-6, -2, 3, 0, Math.PI*2);
        ctx.arc(6, -2, 3, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-6, -2, 1, 0, Math.PI*2);
        ctx.arc(6, -2, 1, 0, Math.PI*2);
        ctx.fillStyle = '#222';
        ctx.fill();
        ctx.restore();
    }
    function drawHero() {
        ctx.save();
        ctx.translate(hero.x, hero.y);
        ctx.scale(hero.direction, 1);
        // Cape
        ctx.beginPath();
        ctx.moveTo(-10, -hero.h/2+10);
        ctx.bezierCurveTo(-40, 0, -40, 40, 0, hero.h/2-8);
        ctx.lineTo(0, hero.h/2-8);
        ctx.closePath();
        ctx.fillStyle = hero.capeColor;
        ctx.globalAlpha = 0.8;
        ctx.fill();
        ctx.globalAlpha = 1;
        // Body
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 26, 0, 0, Math.PI*2);
        ctx.fillStyle = hero.color;
        ctx.shadowColor = '#ffe066';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
        // Underwear
        ctx.beginPath();
        ctx.ellipse(0, 14, 14, 8, 0, 0, Math.PI);
        ctx.fillStyle = hero.underwearColor;
        ctx.fill();
        // Head
        ctx.beginPath();
        ctx.arc(0, -22, 12, 0, Math.PI*2);
        ctx.fillStyle = hero.color;
        ctx.fill();
        // Eyes
        ctx.beginPath();
        ctx.arc(-5, -25, 2.2, 0, Math.PI*2);
        ctx.arc(5, -25, 2.2, 0, Math.PI*2);
        ctx.fillStyle = '#222';
        ctx.fill();
        // Smile
        ctx.beginPath();
        ctx.arc(0, -18, 5, 0, Math.PI);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    function drawBrickRect(x, y, w, h) {
        // Draw base
        ctx.fillStyle = '#a22';
        ctx.fillRect(x, y, w, h);
        // Draw bricks
        let brickH = 10;
        let brickW = 28;
        ctx.strokeStyle = '#e55';
        ctx.lineWidth = 2;
        for (let row = 0; row < h/brickH; ++row) {
            let y0 = y + row*brickH;
            let offset = (row%2) * (brickW/2);
            for (let bx = 0; bx < w; bx += brickW) {
                let x0 = x + bx + offset;
                let bw = Math.min(brickW, x + w - x0);
                if (bw > 0) {
                    ctx.strokeRect(x0, y0, bw, brickH);
                }
            }
        }
    }
    function drawPlatforms() {
        ctx.save();
        for (let p of platforms) {
            ctx.shadowColor = '#ffe06688';
            ctx.shadowBlur = 12;
            drawBrickRect(p.x, p.y, p.w, p.h);
            ctx.shadowBlur = 0;
        }
        ctx.restore();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawPlatforms();
        for (let c of coins) drawCoin(c);
        for (let e of enemies) drawEnemy(e);
        drawHero();
        // Draw score
        ctx.save();
        ctx.font = 'bold 32px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 4;
        ctx.textAlign = 'left';
        ctx.strokeText('Coins: ' + score, 32, 48);
        ctx.fillText('Coins: ' + score, 32, 48);
        ctx.restore();
    }

    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
    </script>
</body>
</html>
